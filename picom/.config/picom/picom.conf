# Shadows
shadow = true;
shadow-radius = 7;
shadow-offset-x = -7;
shadow-offset-y = -7;
# shadow-color = "#000000"
# crop-shadow-to-monitor = false

# Fading
fading = true;
fade-in-step = 0.028;
fade-out-step = 0.03;
fade-delta = 4;
# no-fading-openclose = false
# no-fading-destroyed-argb = false

# Transparency/Opacity
# frame-opacity = 0.9
# inactive-dim-fixed = true

# Corners
#  Fix GTK round corner black edges problem: https://unix.stackexchange.com/questions/705043/rounded-corners-from-gtk-theme-have-black-background
corner-radius = 0;

# Blur
# blur-method = "dual_kawase"
# blur-strength = 3
# blur-size = 12
# blur-deviation = false
# blur-background = false
# blur-background-frame = false
# blur-background-fixed = false
blur-kern = "3x3box";

# General Settings
# dbus = true
# daemon = false
# backend = "xrender"
backend = "glx";
dithered-present = false;
vsync = true;
detect-rounded-corners = true;
detect-client-opacity = true;
# use-ewmh-active-win = false
# unredir-if-possible = false
# unredir-if-possible-delay = 0
detect-transient = true;
# detect-client-leader = false
use-damage = true;
# xrender-sync-fence = false
# window-shader-fg = "default"
# force-win-blend = false
# no-ewmh-fullscreen = false
# max-brightness = 1.0
# transparent-clipping = false
# log-level = "warn";
# log-file = "/path/to/your/log/file"
# write-pid-path = "/path/to/your/log/file"

# Rules
rules: (
	{ match = "window_type = 'tooltip'"; fade = true; shadow = false; full-shadow = false; opacity = 0.95; focus = true; },
	{ match = "window_type = 'dock'"; shadow = false; },
	{ match = "window_type = 'dnd'"; shadow = false; },
	{ match = "window_type = 'menu'"; fade = true; shadow = false; },
	{ match = "window_type = 'popup_menu'"; opacity = 0.95; shadow = false; },
	{ match = "window_type = 'dropdown_menu'"; opacity = 0.95; shadow = false; },
	{ match = "window_type = 'utility'"; shadow = false; },

	# { match = "class_g = 'kitty' && !focused"; opacity = 0.85; },
	# { match = "(class_g = 'firefox' || class_g = 'kitty') && focused"; opacity = 0.85; },
)
